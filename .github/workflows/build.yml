name: DumpC2J Kernel Builder

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Custom Kernel Name (LOCALVERSION)"
        required: true
        type: string
        default: "-anykern3-11-DumpC2J"
      spoof_uname:
        description: "Spoof Uname (SUSFS/Stock Naming)"
        required: true
        type: boolean
        default: false
      clang_variant:
        description: "Clang Toolchain"
        required: true
        type: choice
        options:
          - neutron
          - cirrus
          - weebx
          - zyc
        default: neutron
      hz:
        description: "Refresh Rate (HZ)"
        required: true
        type: choice
        options:
          - powersave
          - balance
          - smooth
          - performance
          - ultra-performance
        default: smooth
      variant:
        description: "Build Variant"
        required: true
        type: choice
        options:
          - stock
          - root
          - susfs
        default: stock
      root:
        description: "Root Method"
        required: true
        type: choice
        options:
          - none
          - ksu-next
          - kowsu
          - sukisu
          - resukisu
        default: sukisu
      lto:
        description: "LTO Mode"
        required: true
        type: choice
        options:
          - full
          - thin
          - none
        default: full
      bypasscharging:
        description: "Bypass Charging (MCA Override)"
        required: true
        type: boolean
        default: true
      droidspaces:
        description: "Droidspaces Support"
        required: true
        type: boolean
        default: false
      kernel_version_spoof:
        description: "Spoof Kernel Version (kosongkan = pakai upstream)"
        required: false
        type: string
        default: ""
      debug:
        description: "Debug Mode (nokaslr, no optimizations)"
        required: true
        type: boolean
        default: false
      nomount:
        description: "NoMount (VFS Path Injection, no mount table)"
        required: true
        type: boolean
        default: false
      run_mode:
        description: "Run Mode (Release=pinned only, Test=check upstream)"
        required: true
        type: choice
        options:
          - Release
          - Test
        default: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: "Custom Build"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      lto_actual: ${{ steps.lto_output.outputs.lto_actual }}

    steps:
      - name: Validate Input Combination
        run: |
          if [ "${{ inputs.variant }}" == "root" ] && [ "${{ inputs.root }}" == "resukisu" ]; then
            echo "::warning::ReSukiSU root-only was previously blocked due to a manager-open crash — retesting after execveat_init fix (commit 7667f76)."
          fi
          echo "[+] Input combination valid: variant=${{ inputs.variant }}, root=${{ inputs.root }}"

      - name: Checkout Builder
        uses: actions/checkout@v4
        with:
          path: builder
          fetch-depth: 0

      - name: Clone Kernel Source
        run: |
          git clone --depth=50 \
            --branch main \
            https://${{ secrets.GH_TOKEN }}@github.com/adennnqt/DumpC2J-Kernel \
            kernel-source

      - name: Parse Inputs
        id: setup_vars
        env:
          INPUT_HZ: ${{ inputs.hz }}
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_ROOT: ${{ inputs.root }}
          INPUT_HARDENED: "off"
          INPUT_BYPASS: ${{ inputs.bypasscharging && 'on' || 'off' }}
          INPUT_DROIDSPACES: ${{ inputs.droidspaces && 'on' || 'off' }}
          INPUT_HTSR: "on"
          INPUT_WIFI: "on"
          INPUT_KGSL: "on"
          INPUT_DATA: "on"
          INPUT_DEBUG: ${{ inputs.debug && 'on' || 'off' }}
          INPUT_KERNEL_NAME: ${{ inputs.kernel_name }}
          INPUT_SPOOF_UNAME: ${{ inputs.spoof_uname && 'on' || 'off' }}
          INPUT_NOMOUNT: ${{ inputs.nomount && 'on' || 'off' }}
        run: |
          if [ "$INPUT_HZ" == "powersave" ]; then HZ_ID=100
          elif [ "$INPUT_HZ" == "balance" ]; then HZ_ID=250
          elif [ "$INPUT_HZ" == "performance" ]; then HZ_ID=500
          elif [ "$INPUT_HZ" == "smooth" ]; then HZ_ID=300
          elif [ "$INPUT_HZ" == "ultra-performance" ]; then HZ_ID=1000
          fi
          echo "HZ_ID=$HZ_ID" >> $GITHUB_ENV

          ACTUAL_ROOT="$INPUT_ROOT"
          if [ "$INPUT_VARIANT" == "stock" ]; then
            ACTUAL_ROOT="none"
          fi
          echo "ACTUAL_ROOT=$ACTUAL_ROOT" >> $GITHUB_ENV

          if [ "$INPUT_VARIANT" == "stock" ]; then
            BUILD_NAME="${INPUT_VARIANT}-${INPUT_HZ}"
          else
            BUILD_NAME="${INPUT_VARIANT}-${ACTUAL_ROOT}-${INPUT_HZ}"
          fi

          [ "$INPUT_BYPASS" == "on" ] && BUILD_NAME="${BUILD_NAME}-bypasscharging"
          [ "$INPUT_DROIDSPACES" == "on" ] && BUILD_NAME="${BUILD_NAME}-droidspaces"
          [ "$INPUT_DEBUG" == "on" ] && BUILD_NAME="${BUILD_NAME}-debug"
          [ "$INPUT_NOMOUNT" == "on" ] && BUILD_NAME="${BUILD_NAME}-nomount"

          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV

      - name: Create Swap
        run: |
          SWAPFILE="/mnt/build_swapfile"
          while true; do
            if sudo fallocate -l 10G $SWAPFILE || sudo dd if=/dev/zero of=$SWAPFILE bs=1M count=10240 status=progress; then
              break
            else
              sleep 5
            fi
          done
          sudo chmod 600 $SWAPFILE && sudo mkswap $SWAPFILE && sudo swapon $SWAPFILE

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 clang lld llvm jq

      - name: Setup Clang
        run: |
          bash builder/scripts/setup_clang.sh ${{ inputs.clang_variant }}

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp kernel-source/anykernel/anykernel.sh anykernel/anykernel.sh
          cp -r kernel-source/anykernel/tools/* anykernel/tools/

      - name: Scout Checkpoint
        env:
          ROOT: ${{ env.ACTUAL_ROOT }}
          VARIANT: ${{ inputs.variant }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: bash builder/scripts/scout.sh

      - name: Setup ccache
        env:
          ACTUAL_ROOT: ${{ env.ACTUAL_ROOT }}
          CLANG_VARIANT: ${{ inputs.clang_variant }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash builder/scripts/lib/ccache_setup.sh

      - name: Build Kernel
        env:
          INPUT_HZ: ${{ inputs.hz }}
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_ROOT: ${{ inputs.root }}
          INPUT_LTO: ${{ inputs.lto }}
          INPUT_HARDENED: "off"
          INPUT_HTSR: "on"
          INPUT_WIFI: "on"
          INPUT_KGSL: "on"
          INPUT_DATA: "on"
          INPUT_BYPASS: ${{ inputs.bypasscharging && 'on' || 'off' }}
          INPUT_DROIDSPACES: ${{ inputs.droidspaces && 'on' || 'off' }}
          INPUT_DEBUG: ${{ inputs.debug && 'on' || 'off' }}
          INPUT_KERNEL_NAME: ${{ inputs.kernel_name }}
          INPUT_SPOOF_UNAME: ${{ inputs.spoof_uname && 'on' || 'off' }}
          INPUT_VERSION_SPOOF: ${{ inputs.kernel_version_spoof }}
          INPUT_NOMOUNT: ${{ inputs.nomount && 'on' || 'off' }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          bash builder/scripts/build.sh

      - name: Save ccache
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash builder/scripts/lib/ccache_save.sh

      - name: Set LTO Output
        id: lto_output
        run: echo "lto_actual=${{ env.LTO_ACTUAL }}" >> "$GITHUB_OUTPUT"

name: Build Onyx Flashable Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:
    inputs:
      ksu_next_ref:
        description: "KernelSU-Next branch/tag"
        default: "next"
        required: false
      susfs_ref:
        description: "SUSFS branch matching kernel version (e.g. gki-android15-6.6)"
        default: "gki-android15-6.6"
        required: false

env:
  KERNEL_REPO: xiaomi-onyx-dev/android_kernel_xiaomi_sm8735
  DEVICETREE_REPO: xiaomi-onyx-dev/android_kernel_xiaomi_sm8735-devicetrees
  MODULES_REPO: xiaomi-onyx-dev/android_kernel_xiaomi_sm8735-modules
  DEVICE_REPO: xiaomi-onyx-dev/android_device_xiaomi_onyx
  KERNEL_BRANCH: lineage-23.2
  BUILD_CONFIG: build.config.msm.sun
  WORKDIR: kernel_platform

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (GH runners are tight for GKI builds)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git-core python3 python3-pip curl bc bison flex \
            libssl-dev libelf-dev zip unzip device-tree-compiler

      - name: Clone msm-kernel (main GKI tree)
        run: |
          mkdir -p ${{ env.WORKDIR }}
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} \
            https://github.com/${{ env.KERNEL_REPO }}.git ${{ env.WORKDIR }}/msm-kernel

      - name: Clone devicetree
        run: |
          git clone --depth=1 \
            https://github.com/${{ env.DEVICETREE_REPO }}.git ${{ env.WORKDIR }}/msm-kernel/devicetree

      - name: Clone vendor modules (camera/display/etc)
        run: |
          git clone --depth=1 \
            https://github.com/${{ env.MODULES_REPO }}.git ${{ env.WORKDIR }}/msm-kernel/vendor-modules

      - name: Clone device tree glue
        run: |
          git clone --depth=1 \
            https://github.com/${{ env.DEVICE_REPO }}.git ${{ env.WORKDIR }}/device

      # ---------------------------------------------------------------
      # KernelSU-Next
      # ---------------------------------------------------------------
      - name: Setup KernelSU-Next
        working-directory: ${{ env.WORKDIR }}/msm-kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | \
            bash -s ${{ github.event.inputs.ksu_next_ref }}
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.BUILD_CONFIG }}
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/${{ env.BUILD_CONFIG }}
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/${{ env.BUILD_CONFIG }}
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/${{ env.BUILD_CONFIG }}

      # ---------------------------------------------------------------
      # SUSFS
      # ---------------------------------------------------------------
      - name: Clone + apply SUSFS patches
        working-directory: ${{ env.WORKDIR }}
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.susfs_ref }} \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

          cd msm-kernel
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch .
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 < 50_add_susfs_in_gki-android15-6.6.patch || {
            echo "::warning::SUSFS patch had rejects — check .rej files, this kernel tree may have diverged from stock GKI 6.6"
            find . -name '*.rej'
          }

          cat >> arch/arm64/configs/${{ env.BUILD_CONFIG }} << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          EOF

      # ---------------------------------------------------------------
      # NoMount (maxsteeel/nomount) — VFS-layer file injection/redirection,
      # zero mount-table pollution. Kernel 6.6 -> use the 6.6 (or closest
      # below) integration patch shipped in kernel/.
      # ---------------------------------------------------------------
      - name: Clone + apply NoMount
        working-directory: ${{ env.WORKDIR }}
        run: |
          git clone --depth=1 https://github.com/maxsteeel/nomount.git nomount

      - name: Integrate NoMount into kernel tree
        working-directory: ${{ env.WORKDIR }}/msm-kernel
        run: |
          set -e
          NM=../../nomount/kernel
          # Pick the integration patch matching this kernel version (6.6).
          # Falls back to the closest available if an exact 6.6 patch
          # doesn't exist — CHECK https://github.com/maxsteeel/nomount/tree/master/kernel
          # for the current filename before relying on this in prod.
          PATCH=$(ls "$NM"/nomount_6.6*_kernel_integration.patch 2>/dev/null | head -n1)
          if [ -z "$PATCH" ]; then
            PATCH=$(ls "$NM"/nomount_*_kernel_integration.patch 2>/dev/null | sort -V | tail -n1)
            echo "::warning::No exact 6.6 NoMount patch found, falling back to $PATCH — verify manually against INTEGRATION.md if this rejects"
          fi
          patch -p1 < "$PATCH" || {
            echo "::warning::NoMount patch had rejects — see kernel/INTEGRATION.md in the nomount repo for manual hook points"
            find . -name '*.rej'
          }
          cp "$NM"/src/* fs/
          echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/${{ env.BUILD_CONFIG }}

      # ---------------------------------------------------------------
      # DroidSpaces (ravindu644/Droidspaces-OSS) — LXC-like container
      # runtime support. GKI 6.6 (below-6.12 track) needs the mandatory
      # kABI-safe SYSVIPC patch BEFORE enabling CONFIG_SYSVIPC, or vendor
      # modules (GPU/camera) will bootloop from task_struct offset shift.
      # ---------------------------------------------------------------
      - name: Clone Droidspaces-OSS
        working-directory: ${{ env.WORKDIR }}
        run: |
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git droidspaces

      - name: Apply mandatory kABI fix + DroidSpaces defconfig
        working-directory: ${{ env.WORKDIR }}/msm-kernel
        run: |
          set -e
          DS=../../droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12
          patch -p1 < "$DS/001.GKI-below-6.12-fix_sysvipc_kABI_6_7_8.patch" || {
            echo "::error::Mandatory SYSVIPC kABI patch failed — DO NOT enable CONFIG_SYSVIPC without this, vendor modules will bootloop"
            find . -name '*.rej'
            exit 1
          }

          cat >> arch/arm64/configs/${{ env.BUILD_CONFIG }} << 'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          # optional: UFW / fail2ban inside containers
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          EOF

      # ---------------------------------------------------------------
      # Bazel / Kleaf build
      # ---------------------------------------------------------------
      - name: Build with Kleaf/Bazel
        working-directory: ${{ env.WORKDIR }}/msm-kernel
        run: |
          tools/bazel run --config=fast //msm-kernel:sun_defconfig_dist \
            -- --dist_dir=$GITHUB_WORKSPACE/out/dist

      - name: Package AnyKernel3 flashable zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/README.md ak3/ramdisk ak3/patch ak3/tools/dtbTool* 2>/dev/null || true
          cp out/dist/Image ak3/ 2>/dev/null || cp out/dist/Image.gz ak3/ 2>/dev/null
          find out/dist -iname '*dtbo*' -exec cp {} ak3/dtbo.img \; 2>/dev/null || true
          find out/dist -iname '*.dtb' -exec cat {} \; > ak3/dtb 2>/dev/null || true
          cat > ak3/anykernel.sh << 'EOF'
          properties() { '
          kernel.string=Onyx KSU-Next+SUSFS Kernel by Vicky
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=onyx
          device.name2=sun
          supported.versions=15,16
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=0;
          . tools/ak3-core.sh
          dump_boot
          write_boot
          EOF
          cd ak3 && zip -r9 ../out/onyx-ksu-susfs-kernel-$(date +%Y%m%d-%H%M).zip . -x '.git*'

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: onyx-flashable-kernel
          path: out/*.zip

   | **Kernel Name** | `${{ inputs.kernel_name }}` |
            | **Run Mode** | `${{ inputs.run_mode }}` |
            
            ### ✨ Features & Mods
            | Feature | Status |
            | :--- | :--- |
            | **Bypass Charging** | `${{ inputs.bypasscharging }}` |
            | **NoMount** | `${{ inputs.nomount }}` |
            | **Droidspaces** | `${{ inputs.droidspaces }}` |
            | **Spoof Uname** | `${{ inputs.spoof_uname }}` |
            | **Spoof Kernel Version** | `${{ inputs.kernel_version_spoof || 'Upstream' }}` |
            | **Debug Mode** | `${{ inputs.debug }}` |
            
            **Commit:** ${{ github.sha }}
            **Ref:** ${{ github.ref }}
            
            > [!CAUTION]
            > **BACKUP your boot.img** before flashing to recover from potential bootloops or other issues.
          files: release_assets/*
