name: Build Onyx Flashable Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:
    inputs:
      ksu_next_ref:
        description: "KernelSU-Next branch/tag"
        default: "next"
        required: false
      susfs_ref:
        description: "SUSFS branch matching kernel version (e.g. gki-android15-6.6)"
        default: "gki-android15-6.6"
        required: false

env:
  KERNEL_REPO: xiaomi-onyx-dev/android_kernel_xiaomi_sm8735
  DEVICETREE_REPO: xiaomi-onyx-dev/android_kernel_xiaomi_sm8735-devicetrees
  MODULES_REPO: xiaomi-onyx-dev/android_kernel_xiaomi_sm8735-modules
  DEVICE_REPO: xiaomi-onyx-dev/android_device_xiaomi_onyx
  KERNEL_BRANCH: lineage-23.2
  BUILD_CONFIG: build.config.msm.sun
  WORKDIR: kernel_platform

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (GH runners are tight for GKI builds)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git-core python3 python3-pip curl bc bison flex \
            libssl-dev libelf-dev zip unzip device-tree-compiler

      - name: Clone msm-kernel (main GKI tree)
        run: |
          mkdir -p ${{ env.WORKDIR }}
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} \
            https://github.com/${{ env.KERNEL_REPO }}.git ${{ env.WORKDIR }}/msm-kernel

      - name: Clone devicetree
        run: |
          git clone --depth=1 \
            https://github.com/${{ env.DEVICETREE_REPO }}.git ${{ env.WORKDIR }}/msm-kernel/devicetree

      - name: Clone vendor modules (camera/display/etc)
        run: |
          git clone --depth=1 \
            https://github.com/${{ env.MODULES_REPO }}.git ${{ env.WORKDIR }}/msm-kernel/vendor-modules

      - name: Clone device tree glue
        run: |
          git clone --depth=1 \
            https://github.com/${{ env.DEVICE_REPO }}.git ${{ env.WORKDIR }}/device

      # ---------------------------------------------------------------
      # KernelSU-Next
      # ---------------------------------------------------------------
      - name: Setup KernelSU-Next
        working-directory: ${{ env.WORKDIR }}/msm-kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | \
            bash -s ${{ github.event.inputs.ksu_next_ref }}
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.BUILD_CONFIG }}
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/${{ env.BUILD_CONFIG }}
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/${{ env.BUILD_CONFIG }}
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/${{ env.BUILD_CONFIG }}

      # ---------------------------------------------------------------
      # SUSFS
      # ---------------------------------------------------------------
      - name: Clone + apply SUSFS patches
        working-directory: ${{ env.WORKDIR }}
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.susfs_ref }} \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

          cd msm-kernel
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch .
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 < 50_add_susfs_in_gki-android15-6.6.patch || {
            echo "::warning::SUSFS patch had rejects — check .rej files, this kernel tree may have diverged from stock GKI 6.6"
            find . -name '*.rej'
          }

          cat >> arch/arm64/configs/${{ env.BUILD_CONFIG }} << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          EOF

      # ---------------------------------------------------------------
      # NoMount (maxsteeel/nomount) — VFS-layer file injection/redirection,
      # zero mount-table pollution. Kernel 6.6 -> use the 6.6 (or closest
      # below) integration patch shipped in kernel/.
      # ---------------------------------------------------------------
      - name: Clone + apply NoMount
        working-directory: ${{ env.WORKDIR }}
        run: |
          git clone --depth=1 https://github.com/maxsteeel/nomount.git nomount

      - name: Integrate NoMount into kernel tree
        working-directory: ${{ env.WORKDIR }}/msm-kernel
        run: |
          NM=../../nomount/kernel
          echo "=== Listing actual nomount/kernel contents (use this to fix filenames below) ==="
          find "$NM" -maxdepth 2 -type f

          # Don't guess a filename — pick whatever integration patch actually
          # exists, preferring one that mentions 6.6/6.1 if present.
          PATCH=$(find "$NM" -maxdepth 1 -iname '*integration*.patch' | grep -E '6\.6|6\.1' | head -n1)
          if [ -z "$PATCH" ]; then
            PATCH=$(find "$NM" -maxdepth 1 -iname '*integration*.patch' | sort -V | tail -n1)
          fi

          if [ -z "$PATCH" ]; then
            echo "::warning::No NoMount integration patch found under $NM — see file listing above, skipping NoMount (kernel builds without it)"
          else
            echo "Using NoMount patch: $PATCH"
            patch -p1 < "$PATCH" || {
              echo "::warning::NoMount patch had rejects — check kernel/INTEGRATION.md in the nomount repo for manual hook points"
              find . -name '*.rej'
            }
          fi

          if [ -d "$NM/src" ]; then
            cp "$NM"/src/* fs/
            echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/${{ env.BUILD_CONFIG }}
          else
            echo "::warning::$NM/src not found — see file listing above, NoMount source not copied, skipping CONFIG_NOMOUNT"
          fi

      # ---------------------------------------------------------------
      # DroidSpaces (ravindu644/Droidspaces-OSS) — LXC-like container
      # runtime support. This is Xiaomi's OSS kernel (vendor drivers
      # compiled in-tree, monolithic build) — NOT a strict split-ABI GKI
      # tree, so we use the Non-GKI path: no kABI-freeze to respect,
      # just enable the configs + apply the non-GKI patch set directly.
      # ---------------------------------------------------------------
      - name: Clone Droidspaces-OSS
        working-directory: ${{ env.WORKDIR }}
        run: |
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git droidspaces

      - name: Apply non-GKI DroidSpaces patches + defconfig
        working-directory: ${{ env.WORKDIR }}/msm-kernel
        run: |
          DS=../../droidspaces/Documentation/resources/kernel-patches/non-GKI
          echo "=== Listing non-GKI patch set ==="
          find "$DS" -maxdepth 1 -type f 2>/dev/null || echo "::warning::non-GKI patches dir not found — check Droidspaces-OSS repo layout, may have moved"

          for p in "$DS"/*.patch; do
            [ -e "$p" ] || continue
            echo "Applying $p"
            patch -p1 < "$p" || {
              echo "::warning::DroidSpaces patch $p had rejects — this OSS tree has custom proc/fs changes, check .rej manually"
              find . -name '*.rej'
            }
          done

          cat >> arch/arm64/configs/${{ env.BUILD_CONFIG }} << 'EOF'
          # DroidSpaces — non-GKI path (no kABI-freeze constraint on this OSS tree)
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          # optional: UFW / fail2ban inside containers
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_MATCH_LIMIT=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          EOF

      # ---------------------------------------------------------------
      # Bazel / Kleaf build
      # ---------------------------------------------------------------
      - name: Build with Kleaf/Bazel
        working-directory: ${{ env.WORKDIR }}/msm-kernel
        run: |
          tools/bazel run --config=fast //msm-kernel:sun_defconfig_dist \
            -- --dist_dir=$GITHUB_WORKSPACE/out/dist

      - name: Package AnyKernel3 flashable zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/README.md ak3/ramdisk ak3/patch ak3/tools/dtbTool* 2>/dev/null || true
          cp out/dist/Image ak3/ 2>/dev/null || cp out/dist/Image.gz ak3/ 2>/dev/null
          find out/dist -iname '*dtbo*' -exec cp {} ak3/dtbo.img \; 2>/dev/null || true
          find out/dist -iname '*.dtb' -exec cat {} \; > ak3/dtb 2>/dev/null || true
          cat > ak3/anykernel.sh << 'EOF'
          properties() { '
          kernel.string=Onyx KSU-Next+SUSFS Kernel by Vicky
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=onyx
          device.name2=sun
          supported.versions=15,16
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=0;
          . tools/ak3-core.sh
          dump_boot
          write_boot
          EOF
          cd ak3 && zip -r9 ../out/onyx-ksu-susfs-kernel-$(date +%Y%m%d-%H%M).zip . -x '.git*'

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: onyx-flashable-kernel
          path: out/*.zip
          
